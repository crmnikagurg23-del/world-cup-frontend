<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolletto Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ffcc; --bg: #061218; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background: var(--bg); color: #fff; background-image: linear-gradient(rgba(6,18,24,0.9), rgba(6,18,24,0.9)), url('https://theminaretonline.org/wp-content/uploads/2021/11/world-cup.jpeg'); background-size: cover; background-attachment: fixed; }
        
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .card { background: rgba(15, 33, 42, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 15px; }
        
        /* Stats Table */
        .stats-table { width: 100%; text-align: center; border-collapse: collapse; }
        .stats-table th { font-size: 10px; color: #8899a6; text-transform: uppercase; padding-bottom: 5px; }
        .stats-table td { font-size: 20px; font-family: 'Rajdhani'; color: var(--primary); }

        /* Game Card Fix */
        .game-card { background: rgba(15, 33, 42, 0.9); border-radius: 15px; padding: 15px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .match-header { text-align: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        .team { font-weight: 700; font-family: 'Rajdhani'; font-size: 18px; display: block; }
        .vs { font-size: 10px; color: var(--primary); margin: 5px 0; display: block; }

        .options { display: flex; gap: 10px; }
        .opt { flex: 1; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px; font-weight: 700; cursor: pointer; text-align: center; }
        
        .selected { background: rgba(0, 255, 204, 0.2) !important; border: 1px solid var(--primary) !important; }
        .res-correct { background: var(--primary) !important; color: #000 !important; }
        .res-wrong { background: #ff4d4d !important; }
        .res-actual { border: 2px solid var(--primary) !important; }

        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; background: #000; border: 1px solid #333; color: #fff; }
        .btn { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .hidden { display: none !important; }
        
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
        .tab { padding: 8px 15px; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .tab.active { background: var(--primary); color: #000; }
        
        .lb-row { display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.03); margin-bottom: 5px; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="status" class="card hidden">
            <table class="stats-table">
                <tr><th>Rank</th><th>Score</th><th>Action</th></tr>
                <tr><td id="my-rank">-</td><td id="my-score">0</td><td onclick="logout()" style="color:#ff4d4d; font-size:12px; cursor:pointer;">EXIT</td></tr>
            </table>
        </div>

        <div id="login-view" class="card">
            <h2 style="text-align:center; margin-bottom:15px; font-family:'Rajdhani'; color:var(--primary);">WORLD CUP 2026</h2>
            <input id="u" placeholder="Username">
            <input id="p" type="password" placeholder="Password">
            <button class="btn" onclick="auth('login')">Login</button>
            <p onclick="toggle(true)" style="text-align:center; font-size:12px; margin-top:10px; cursor:pointer; color:var(--primary);">Create Account</p>
        </div>

        <div id="signup-view" class="card hidden">
            <h2 style="text-align:center; margin-bottom:15px; font-family:'Rajdhani'; color:var(--primary);">REGISTER</h2>
            <input id="ru" placeholder="Rolletto Username">
            <input id="rp" type="password" placeholder="Create Password">
            <button class="btn" onclick="auth('signup')">Sign Up</button>
            <p onclick="toggle(false)" style="text-align:center; font-size:12px; margin-top:10px; cursor:pointer;">Back to Login</p>
        </div>

        <div id="game-view" class="hidden">
            <div class="tabs" id="tabs"></div>
            <div id="games"></div>
            <button id="save-btn" class="btn hidden" onclick="save()">Submit Predictions</button>
        </div>

        <div class="card">
            <h3 style="font-size:14px; margin-bottom:10px; color:var(--primary);">LEADERBOARD</h3>
            <div id="lb"></div>
        </div>
    </div>

    <script>
        const API = 'https://rolletto-backend-1.onrender.com/api';
        let DATA = {}; let DAY = ""; let ANS = {};

        function toggle(s) { document.getElementById('login-view').classList.toggle('hidden', s); document.getElementById('signup-view').classList.toggle('hidden', !s); }

        async function auth(type) {
            const u = type === 'login' ? document.getElementById('u').value : document.getElementById('ru').value;
            const p = type === 'login' ? document.getElementById('p').value : document.getElementById('rp').value;
            const res = await fetch(`${API}/${type}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({user:u, password:p}) }).then(r => r.json());
            if(res.success) {
                localStorage.setItem('u', u); localStorage.setItem('p', p);
                DATA = res;
                document.getElementById('my-rank').innerText = `#${res.userRank}`;
                document.getElementById('my-score').innerText = res.userScore;
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('signup-view').classList.add('hidden');
                document.getElementById('status').classList.remove('hidden');
                document.getElementById('game-view').classList.remove('hidden');
                renderTabs(); loadLB();
            } else alert(res.message);
        }

        function renderTabs() {
            const container = document.getElementById('tabs'); container.innerHTML = "";
            const now = new Date().toISOString().split('T')[0];
            const days = Object.keys(DATA.allDays).sort((a,b) => a-b);
            days.filter(id => DATA.allDays[id].date <= now).forEach(id => {
                const b = document.createElement('div');
                b.className = 'tab' + (DAY === id ? ' active' : '');
                b.innerText = DATA.allDays[id].title;
                b.onclick = () => { DAY = id; renderGames(); };
                container.appendChild(b);
            });
            if(!DAY && days.length > 0) { DAY = days[days.length-1]; renderGames(); }
        }

        function renderGames() {
            renderTabs();
            const container = document.getElementById('games'); container.innerHTML = "";
            const info = DATA.allDays[DAY];
            const pred = DATA.userPredictions.find(p => p.dayId === DAY);
            const results = info.results || [];
            ANS = {};

            info.matches.forEach((m, i) => {
                const teams = m.split(' vs ');
                const real = (results[i] && results[i].trim() !== "") ? results[i].trim() : null;
                let opts = "";
                ['1', 'X', '2'].forEach(o => {
                    let cls = "opt";
                    const my = pred ? pred.answers[i] : null;
                    if(real) {
                        if(o === real) { cls += " res-actual"; if(my === real) cls += " res-correct"; }
                        else if(o === my) cls += " res-wrong";
                    } else if(my === o || ANS[i] === o) cls += " selected";
                    opts += `<div class="${cls}" onclick="${(!pred) ? `pick(this, ${i}, '${o}')` : ''}">${o}</div>`;
                });
                container.innerHTML += `<div class="game-card"><div class="match-header"><span class="team">${teams[0]}</span><span class="vs">VS</span><span class="team">${teams[1]}</span></div><div class="options">${opts}</div></div>`;
            });
            document.getElementById('save-btn').classList.toggle('hidden', !!pred);
        }

        function pick(el, i, v) { 
            el.parentElement.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected'); ANS[i] = v; 
        }

        async function save() {
            if(Object.keys(ANS).length < DATA.allDays[DAY].matches.length) return alert("Pick all matches!");
            const res = await fetch(`${API}/save-prediction`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: localStorage.getItem('u'), dayId: DAY, answers: ANS}) }).then(r => r.json());
            if(res.success) { DATA.userPredictions.push({dayId: DAY, answers: ANS}); renderGames(); }
        }

        async function loadLB() {
            const res = await fetch(`${API}/leaderboard`).then(r => r.json());
            const user = localStorage.getItem('u')?.toLowerCase();
            document.getElementById('lb').innerHTML = res.topData.map(u => {
                const isMe = u.u.toLowerCase() === user;
                let name = isMe ? u.u : (u.u[0] + "***" + u.u[u.u.length-1]);
                return `<div class="lb-row" style="${isMe ? 'border:1px solid var(--primary)' : ''}"><span>${u.rank}. ${name}</span><b>${u.p} pts</b></div>`;
            }).join('');
        }

        function logout() { localStorage.clear(); location.reload(); }
        window.onload = () => { if(localStorage.getItem('u')) auth('login'); else loadLB(); };
    </script>
</body>
</html>
