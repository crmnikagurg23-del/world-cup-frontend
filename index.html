<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 2026 | Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0b0f1a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .accent-blue { color: #3b82f6; }
        .bg-gradient { background: linear-gradient(135deg, #1e40af 0%, #1e1b4b 100%); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div id="login-screen" class="max-w-md mx-auto mt-32 px-6">
        <div class="glass p-8 rounded-3xl shadow-2xl text-center">
            <h1 class="text-3xl font-black mb-2 uppercase tracking-tighter">Predictor <span class="accent-blue">2026</span></h1>
            <p class="text-slate-400 text-sm mb-8">Enter your credentials to start</p>
            <div class="space-y-4">
                <input type="text" id="username" placeholder="Username" class="w-full p-4 rounded-xl bg-slate-900/50 border border-slate-700 focus:outline-none focus:border-blue-500 transition-all">
                <input type="password" id="password" placeholder="Password" class="w-full p-4 rounded-xl bg-slate-900/50 border border-slate-700 focus:outline-none focus:border-blue-500 transition-all">
                <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-bold transition-all transform hover:scale-[1.02]">Sign In</button>
            </div>
            <p id="login-msg" class="text-red-400 mt-6 text-sm hidden font-medium"></p>
        </div>
    </div>

    <div id="main-content" class="max-w-5xl mx-auto px-4 mt-8 hidden">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="md:col-span-2 glass p-8 rounded-3xl flex items-center justify-between bg-gradient">
                <div>
                    <h2 id="welcome-user" class="text-2xl font-extrabold">Welcome Back!</h2>
                    <p class="text-blue-200 opacity-80">Global Rank: <span id="user-rank" class="font-bold text-white">#0</span></p>
                </div>
                <div class="text-right">
                    <p class="text-xs uppercase tracking-widest text-blue-200 opacity-70">Total Points</p>
                    <p id="user-score" class="text-5xl font-black text-white">0</p>
                </div>
            </div>
            <div class="glass p-8 rounded-3xl flex flex-col justify-center items-center">
                <span class="text-4xl mb-2">🏆</span>
                <p class="text-xs font-bold uppercase text-slate-400">Next Match</p>
                <p class="text-sm font-semibold">Ready for 2026?</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6" id="days-container"></div>

            <div class="space-y-6">
                <div class="glass p-6 rounded-3xl">
                    <h3 class="text-lg font-black mb-6 uppercase tracking-wider accent-blue">Top 10 Leaderboard</h3>
                    <div id="leaderboard" class="space-y-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://rolletto-backend-1.onrender.com/api';
        let currentUser = null;

        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('login-msg');

            try {
                const res = await fetch(`${BASE_URL}/check-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, password: pass })
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = user;
                    showMain(data);
                } else {
                    msg.innerText = data.message;
                    msg.classList.remove('hidden');
                }
            } catch (e) { alert("Server connection failed."); }
        }

        function showMain(data) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('welcome-user').innerText = `Hello, ${currentUser}!`;
            document.getElementById('user-score').innerText = data.userScore;
            document.getElementById('user-rank').innerText = `#${data.userRank}`;

            loadDays(data.allDays, data.userPredictions);
            loadLeaderboard();
        }

        function loadDays(days, predictions) {
            const container = document.getElementById('days-container');
            container.innerHTML = '';

            Object.keys(days).sort((a,b) => a-b).forEach(dayId => {
                const day = days[dayId];
                const hasPredicted = predictions.find(p => p.dayId === dayId);
                
                const card = document.createElement('div');
                card.className = 'glass p-6 rounded-3xl overflow-hidden';
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h4 class="font-black text-xl">${day.title}</h4>
                            <p class="text-xs text-slate-500 uppercase font-bold tracking-widest">${day.sport} • ${day.date}</p>
                        </div>
                        <span class="bg-blue-600/20 text-blue-400 text-[10px] font-black px-3 py-1 rounded-full uppercase">${day.pointsPerGame} PTS / GAME</span>
                    </div>
                    <div class="space-y-3" id="matches-${dayId}">
                        ${day.matches.map((m, i) => `
                            <div class="flex items-center justify-between bg-white/5 p-4 rounded-2xl">
                                <span class="text-sm font-medium">${m}</span>
                                <select id="ans-${dayId}-${i}" ${hasPredicted ? 'disabled' : ''} class="bg-slate-800 rounded-xl p-2 text-xs font-bold outline-none border border-slate-700">
                                    <option value="">PICK</option>
                                    <option value="1">1</option>
                                    <option value="X">X</option>
                                    <option value="2">2</option>
                                </select>
                            </div>
                        `).join('')}
                    </div>
                    ${!hasPredicted 
                        ? `<button onclick="savePredict('${dayId}', ${day.matches.length})" class="w-full mt-6 bg-white text-black p-4 rounded-2xl font-black text-xs uppercase hover:bg-blue-500 hover:text-white transition-all">Submit Prediction</button>`
                        : `<div class="mt-6 p-4 rounded-2xl bg-green-500/10 text-green-400 text-center text-xs font-black uppercase tracking-widest border border-green-500/20">Prediction Locked ✓</div>`
                    }
                `;
                container.appendChild(card);
            });
        }

        async function savePredict(dayId, count) {
            const answers = {};
            for(let i=0; i<count; i++) {
                const val = document.getElementById(`ans-${dayId}-${i}`).value;
                if(!val) return alert("Please complete all picks!");
                answers[i] = val;
            }

            const res = await fetch(`${BASE_URL}/save-prediction`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser, dayId, answers })
            });
            const data = await res.json();
            if(data.success) location.reload();
        }

        async function loadLeaderboard() {
            const res = await fetch(`${BASE_URL}/leaderboard`);
            const data = await res.json();
            const list = document.getElementById('leaderboard');
            list.innerHTML = data.topData.map(u => `
                <div class="flex justify-between items-center bg-white/5 p-4 rounded-2xl border border-white/5">
                    <span class="text-sm font-semibold"><span class="text-slate-500 mr-2">${u.rank}.</span> ${u.u}</span>
                    <span class="font-black text-sm text-blue-400">${u.p} <span class="text-[10px] text-slate-500 ml-1">PTS</span></span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
