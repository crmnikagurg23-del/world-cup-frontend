<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rolletto Predictor | World Cup 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ffcc; --bg-dark: #061218; --glass: rgba(15, 33, 42, 0.9); --accent-gold: #ffcc00; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-dark); color: #fff;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 204, 0.1) 0%, transparent 50%),
                linear-gradient(rgba(6,18,24,0.8), rgba(6,18,24,0.95)), 
                url('https://theminaretonline.org/wp-content/uploads/2021/11/world-cup.jpeg');
            background-size: cover; background-attachment: fixed; background-position: center;
        }

        header { padding: 10px; border-bottom: 1px solid var(--primary); background: var(--glass); position: sticky; top: 0; z-index: 1000; display: flex; justify-content: center; }
        .logo { height: 28px; }
        
        .main-content { padding: 15px; max-width: 600px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

        .my-stats-card { background: rgba(0,255,204,0.1); border: 1px solid var(--primary); padding: 12px; border-radius: 15px; margin-bottom: 15px; display: none; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center; }
        .stat-item span { font-size: 10px; color: #8899a6; text-transform: uppercase; display: block; }
        .stat-item b { font-size: 18px; color: var(--primary); font-family: 'Rajdhani'; }

        .card-auth { background: var(--glass); padding: 25px; border-radius: 20px; margin-top: 15px; border: 1px solid rgba(255,255,255,0.05); }
        input { padding: 15px; border-radius: 10px; width: 100%; margin-bottom: 10px; background: rgba(0,0,0,0.4); border: 1px solid #333; color: #fff; font-size: 16px; outline: none; }
        
        .btn-green { 
            background: var(--primary); color: var(--bg-dark); border: none; padding: 15px; 
            border-radius: 12px; font-weight: 800; width: 100%; font-size: 15px; 
            display: flex; justify-content: center; align-items: center; gap: 10px; cursor: pointer; text-transform: uppercase;
        }
        .btn-green:disabled { background: #555; cursor: not-allowed; opacity: 0.7; }

        .leaderboard-container { margin-top: 25px; background: var(--glass); border-radius: 20px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .lb-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
        .lb-row td { padding: 12px 8px; background: rgba(255,255,255,0.03); border-radius: 10px; font-size: 13px; text-align: center; }
        .lb-username { text-align: left !important; padding-left: 15px !important; }

        .tabs-wrapper { display: flex; gap: 10px; padding: 10px 0; overflow-x: auto; scrollbar-width: none; }
        .day-tab { padding: 10px 20px; background: rgba(255,255,255,0.05); border-radius: 10px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; }
        .day-tab.active { background: var(--primary); color: var(--bg-dark); }

        .game-card { background: var(--glass); padding: 15px; margin: 10px 0; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .match-display { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .team-name { flex: 1; font-weight: 700; font-size: 14px; text-align: center; font-family: 'Rajdhani'; }
        .vs-divider { font-size: 10px; color: var(--primary); padding: 4px 8px; background: rgba(0,255,204,0.1); border-radius: 5px; margin: 0 10px; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .opt-btn { padding: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
        
        .selected { background: rgba(0, 255, 204, 0.2) !important; border: 1px solid var(--primary) !important; }
        .res-correct { background: var(--primary) !important; color: var(--bg-dark) !important; }
        .res-wrong { background: #ff4d4d !important; opacity: 0.7; }
        .res-actual { border: 1px solid var(--primary) !important; color: var(--primary) !important; background: transparent !important; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 15px 25px; border-radius: 10px; font-size: 14px; z-index: 2000; text-align: center; display: none; min-width: 300px; }
        .btn-spinner { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .stat-item b { font-size: 15px; }
            .lb-row td { font-size: 12px; padding: 10px 5px; }
            .team-name { font-size: 12px; }
            .logo { height: 24px; }
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    <header><img src="https://rolletto1.cc/content/125,24fb1440f33968.webp" alt="Rolletto" class="logo" onclick="location.reload()"></header>

    <div class="main-content">
        <div id="my-status" class="my-stats-card">
            <div class="stats-grid">
                <div class="stat-item"><span>Rank</span><b id="my-rank">-</b></div>
                <div class="stat-item"><span>Score</span><b id="my-score">0</b></div>
                <div class="stat-item" onclick="logout()" style="cursor:pointer;"><span style="color:#ff4d4d">EXIT</span><b style="color:#ff4d4d; font-size:12px;">LOGOUT</b></div>
            </div>
        </div>

        <div id="start-section">
            <h2 style="margin: 20px 0; color: var(--primary); font-size: 26px; text-align:center; font-family:'Rajdhani';">PREDICTOR 2026</h2>
            <div class="card-auth">
                <input type="text" id="username" placeholder="USERNAME" autocomplete="off">
                <input type="password" id="password" placeholder="PASSWORD">
                <button id="login-btn" class="btn-green" onclick="startGame()">
                    <span id="btn-text">LOGIN / JOIN</span>
                    <div id="btn-loader" class="btn-spinner"></div>
                </button>
            </div>
        </div>

        <div id="game-section" style="display:none;">
            <div class="tabs-wrapper" id="day-tabs"></div>
            <div id="games-container"></div>
            <button id="save-btn" class="btn-green" style="display:none; margin-top:15px;" onclick="saveCurrentDay()">
                <span id="save-text">SUBMIT PREDICTIONS</span>
                <div id="save-loader" class="btn-spinner"></div>
            </button>
        </div>

        <div class="leaderboard-container">
            <h3 style="color: var(--primary); margin-bottom: 15px; font-size: 16px; border-left: 3px solid var(--primary); padding-left: 10px; font-family:'Rajdhani';">LEADERBOARD</h3>
            <table class="lb-table">
                <thead><tr style="font-size:10px; color:#8899a6; text-transform:uppercase;"><th>#</th><th style="text-align:left; padding-left:15px;">Player</th><th>Score</th><th>Prize</th></tr></thead>
                <tbody id="lb-data"></tbody>
            </table>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://rolletto-backend.onrender.com/api';
        let GLOBAL_DATA = {}; let SELECTED_DAY = ""; let TEMP_ANSWERS = {};

        function showToast(m, isErr = true) {
            const t = document.getElementById('toast'); t.innerText = m;
            t.style.background = isErr ? 'rgba(255, 77, 77, 0.95)' : 'rgba(0, 255, 204, 0.95)';
            t.style.color = 'white'; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000);
        }

        async function startGame() {
            const userField = document.getElementById('username');
            const passField = document.getElementById('password');
            const loginBtn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');

            const user = localStorage.getItem('wc_user') || userField.value.trim();
            const pass = localStorage.getItem('wc_pass') || passField.value.trim();
            
            if(!user || !pass) return;

            loginBtn.disabled = true;
            btnText.innerText = "CONNECTING...";
            btnLoader.style.display = "block";

            try {
                const res = await fetch(`${BASE_URL}/check-user`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({user, password: pass}) 
                }).then(r => r.json());
                
                if(res.success) {
                    localStorage.setItem('wc_user', user); 
                    localStorage.setItem('wc_pass', pass);
                    GLOBAL_DATA = res;
                    document.getElementById('my-rank').innerText = `#${res.userRank}`;
                    document.getElementById('my-score').innerText = res.userScore;
                    document.getElementById('my-status').style.display = 'block';
                    document.getElementById('start-section').style.display = 'none'; 
                    document.getElementById('game-section').style.display = 'block';
                    renderTabs(); loadLB();
                } else { 
                    // ✨ მნიშვნელოვანი: აქ აღარ ვშლით localStorage-ს, თუ უბრალოდ სერვერმა დააგვიანა
                    showToast(res.message); 
                    resetBtn('login-btn', 'btn-text', 'btn-loader', 'LOGIN / JOIN');
                }
            } catch(e) { 
                showToast("Connection error. Try refreshing."); 
                resetBtn('login-btn', 'btn-text', 'btn-loader', 'LOGIN / JOIN');
            }
        }

        function resetBtn(b, t, l, txt) { 
            const btn = document.getElementById(b);
            if(btn) btn.disabled = false;
            const text = document.getElementById(t);
            if(text) text.innerText = txt;
            const loader = document.getElementById(l);
            if(loader) loader.style.display = "none";
        }

        function renderTabs() {
            const container = document.getElementById('day-tabs'); container.innerHTML = "";
            const days = Object.keys(GLOBAL_DATA.allDays).sort();
            const now = new Date().toISOString().split('T')[0];
            days.forEach(dayId => {
                const dInfo = GLOBAL_DATA.allDays[dayId];
                const btn = document.createElement('div');
                btn.className = 'day-tab' + (SELECTED_DAY === dayId ? ' active' : '');
                btn.innerText = (dInfo.date === now) ? "TODAY" : dInfo.title;
                btn.onclick = () => selectDay(dayId);
                container.appendChild(btn);
            });
            if(!SELECTED_DAY) selectDay(days[0]);
        }

        function selectDay(dayId) {
            SELECTED_DAY = dayId; renderTabs();
            const container = document.getElementById('games-container'); container.innerHTML = "";
            const dInfo = GLOBAL_DATA.allDays[dayId];
            const userPred = GLOBAL_DATA.userPredictions.find(p => p.dayId === dayId);
            TEMP_ANSWERS = {};
            dInfo.matches.forEach((game, i) => {
                const teams = game.split(' vs '); let opts = "";
                ['1', 'X', '2'].forEach(opt => {
                    let cls = "opt-btn";
                    if (userPred) {
                        const my = userPred.answers[i]; const real = dInfo.results ? dInfo.results[i] : null;
                        if (real && real !== "") {
                            if (opt === real) cls += (my === real) ? " res-correct" : " res-actual";
                            else if (opt === my) cls += " res-wrong";
                        } else if (opt === my) cls += " selected";
                    }
                    opts += `<button class="${cls}" ${userPred ? 'disabled' : `onclick="pick(this, ${i}, '${opt}')"`}>${opt}</button>`;
                });
                container.innerHTML += `<div class="game-card"><div class="match-display"><div class="team-name">${teams[0]}</div><div class="vs-divider">VS</div><div class="team-name">${teams[1]}</div></div><div class="options-grid">${opts}</div></div>`;
            });
            document.getElementById('save-btn').style.display = userPred ? 'none' : 'block';
        }

        function pick(btn, idx, val) { 
            btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected')); 
            btn.classList.add('selected'); 
            TEMP_ANSWERS[idx] = val; 
        }

        async function saveCurrentDay() {
            const btn = document.getElementById('save-btn'); 
            const txt = document.getElementById('save-text'); 
            const ldr = document.getElementById('save-loader');
            const user = localStorage.getItem('wc_user');
            if(Object.keys(TEMP_ANSWERS).length < GLOBAL_DATA.allDays[SELECTED_DAY].matches.length) return showToast("Select all matches!");
            
            btn.disabled = true; txt.innerText = "SAVING..."; ldr.style.display = "block";
            try {
                const res = await fetch(`${BASE_URL}/save-prediction`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({username: user, dayId: SELECTED_DAY, answers: TEMP_ANSWERS}) 
                }).then(r => r.json());
                
                if(res.success) { 
                    showToast("Saved!", false); 
                    GLOBAL_DATA.userPredictions.push({ dayId: SELECTED_DAY, answers: {...TEMP_ANSWERS} }); 
                    selectDay(SELECTED_DAY); 
                } else { 
                    showToast(res.message); 
                    resetBtn('save-btn', 'save-text', 'save-loader', 'SUBMIT PREDICTIONS'); 
                }
            } catch(e) { 
                showToast("Error saving. Try again!"); 
                resetBtn('save-btn', 'save-text', 'save-loader', 'SUBMIT PREDICTIONS'); 
            }
        }

        async function loadLB() {
            try {
                const data = await fetch(`${BASE_URL}/leaderboard`).then(r => r.json());
                const container = document.getElementById('lb-data'); 
                const cUser = (localStorage.getItem('wc_user') || "").toLowerCase();
                container.innerHTML = data.topData.map(u => {
                    const isMe = u.u.toLowerCase() === cUser;
                    let disp = isMe ? u.u : (u.u.length > 2 ? u.u[0] + "*".repeat(u.u.length-2) + u.u[u.u.length-1] : u.u[0] + "*");
                    return `<tr class="lb-row ${isMe ? 'my-row-highlight' : ''}"><td>${u.rank}</td><td class="lb-username">${disp}</td><td style="color:var(--accent-gold); font-weight:700;">${u.p}</td><td style="font-size:11px;">${{1:"1000€",2:"500€",3:"200€"}[u.rank] || "-"}</td></tr>`;
                }).join('');
            } catch(e) {}
        }

        function logout() { 
            if(confirm("Are you sure you want to logout?")) {
                localStorage.clear(); 
                location.reload(); 
            }
        }
        
        window.onload = () => { 
            if(localStorage.getItem('wc_user')) startGame(); 
            else loadLB(); 
        };
    </script>
</body>
</html>
