<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rolletto Predictor | World Cup 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ffcc; --primary-glow: rgba(0, 255, 204, 0.4); --bg-dark: #061218; --glass: rgba(15, 33, 42, 0.9); --accent-gold: #ffcc00; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-dark); color: #fff;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 204, 0.15) 0%, transparent 50%),
                linear-gradient(rgba(6,18,24,0.7), rgba(6,18,24,0.9)), 
                url('https://theminaretonline.org/wp-content/uploads/2021/11/world-cup.jpeg');
            background-size: cover; background-attachment: fixed; background-position: center;
        }

        .toast {
            position: fixed; top: 20px; right: 20px; left: 20px; max-width: 400px; margin-left: auto;
            padding: 15px 20px; border-radius: 12px; font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10001;
            display: none; animation: slideIn 0.4s ease; border: 1px solid rgba(255,255,255,0.1); text-align: center;
        }
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        header { background: rgba(15, 33, 42, 0.95); backdrop-filter: blur(15px); padding: 12px; display: flex; justify-content: center; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 1000; }
        .logo { height: 32px; cursor: pointer; }
        .main-content { padding: 15px; max-width: 600px; margin: 0 auto; min-height: 100vh; }

        .my-stats-card { background: linear-gradient(135deg, rgba(0,255,204,0.2), rgba(0,0,0,0.4)); border: 1px solid var(--primary); padding: 15px; border-radius: 15px; margin-bottom: 20px; display: none; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; gap: 10px; }
        .stat-item span { display: block; font-size: 10px; color: #8899a6; text-transform: uppercase; }
        .stat-item b { font-size: 18px; color: var(--primary); font-family: 'Rajdhani'; }

        .card-auth { background: var(--glass); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); margin-top: 20px; }
        input { padding: 16px; border-radius: 12px; width: 100%; margin-bottom: 12px; background: rgba(0,0,0,0.5); border: 1px solid #333; color: #fff; font-size: 16px; outline: none; }
        .btn-green { background: var(--primary); color: var(--bg-dark); border: none; padding: 18px; border-radius: 15px; font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 15px; transition: 0.2s; }
        .btn-green:disabled { background: #555; cursor: not-allowed; opacity: 0.7; }

        .leaderboard-container { margin-top: 30px; background: var(--glass); border-radius: 20px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .lb-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .lb-row td { padding: 14px 8px; background: rgba(255,255,255,0.03); border-radius: 10px; text-align: center; font-size: 14px; }
        .my-row-highlight td { background: rgba(0, 255, 204, 0.15) !important; border-top: 1px solid var(--primary); border-bottom: 1px solid var(--primary); }
        .lb-username { text-align: left !important; padding-left: 12px !important; }

        .tabs-wrapper { display: flex; gap: 10px; padding: 10px 0; overflow-x: auto; scrollbar-width: none; }
        .day-tab { padding: 10px 20px; background: rgba(255,255,255,0.05); cursor: pointer; border-radius: 10px; font-weight: 700; color: #aab8c2; white-space: nowrap; font-size: 13px; }
        .day-tab.active { background: var(--primary); color: var(--bg-dark); }
        .game-card { background: var(--glass); padding: 20px; margin: 12px 0; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08); }
        .match-display { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .team-name { flex: 1; font-weight: 700; font-size: 14px; text-align: center; font-family: 'Rajdhani'; }
        .vs-divider { font-size: 10px; color: var(--primary); font-weight: 800; padding: 5px 10px; background: rgba(0,255,204,0.1); border-radius: 6px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .opt-btn { padding: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .opt-btn.selected, .res-correct { background: var(--primary) !important; color: var(--bg-dark) !important; }
        .res-wrong { background: #ff4d4d !important; }
        .res-actual { border: 2px solid var(--primary) !important; color: var(--primary) !important; }

        #loader { display: none; position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; justify-content: center; align-items: center; }
        .spinner { border: 3px solid rgba(0,255,204,0.1); border-left-color: var(--primary); width: 35px; height: 35px; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    <header><img src="https://rolletto1.cc/content/125,24fb1440f33968.webp" alt="Rolletto" class="logo" onclick="location.reload()"></header>
    <div id="loader"><div class="spinner"></div></div>

    <div class="main-content">
        <div id="my-status" class="my-stats-card">
            <div class="stats-grid">
                <div class="stat-item"><span>Your Rank</span><b id="my-rank">-</b></div>
                <div class="stat-item"><span>Your Score</span><b id="my-score">0</b></div>
                <div class="stat-item" onclick="logout()" style="cursor:pointer;"><span>Action</span><b style="color:#ff4d4d; font-size:12px;">LOGOUT</b></div>
            </div>
        </div>

        <div id="start-section">
            <h1 style="margin: 25px 0; color: var(--primary); font-size: 30px; text-align:center; font-family:'Rajdhani';">WORLD CUP 2026</h1>
            <div class="card-auth">
                <input type="text" id="username" placeholder="USERNAME" autocomplete="off">
                <input type="password" id="password" placeholder="PASSWORD">
                <button id="login-btn" class="btn-green" onclick="startGame()">LOGIN / JOIN</button>
            </div>
        </div>

        <div id="game-section" style="display:none;">
            <div class="tabs-wrapper" id="day-tabs"></div>
            <div id="games-container"></div>
            <button id="save-btn" class="btn-green" style="display:none; margin-top:15px;" onclick="saveCurrentDay()">SUBMIT PREDICTIONS</button>
        </div>

        <div class="leaderboard-container">
            <h2 style="color: var(--primary); margin-bottom: 15px; font-size: 18px; border-left: 3px solid var(--primary); padding-left: 12px; font-family:'Rajdhani';">LEADERBOARD</h2>
            <table class="lb-table">
                <thead><tr style="font-size:11px; color:#8899a6; text-transform:uppercase;"><th>Rank</th><th style="text-align:left; padding-left:12px;">Player</th><th>Score</th><th>Prize</th></tr></thead>
                <tbody id="lb-data"></tbody>
            </table>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://rolletto-backend.onrender.com/api';
        let GLOBAL_DATA = {}; let SELECTED_DAY = ""; let TEMP_ANSWERS = {};

        function showToast(message, isError = true) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.background = isError ? 'rgba(255, 77, 77, 0.95)' : 'rgba(0, 255, 204, 0.95)';
            toast.style.color = isError ? 'white' : '#061218';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function getPrize(rank) {
            const prizes = {1: "1000€", 2: "900€", 3: "700€", 4: "600 FB", 5: "500 FB", 6: "400 FB", 7: "300 FB", 8: "200 FB", 9: "100 FB", 10: "50 FB"};
            return prizes[rank] || "-";
        }

        async function startGame() {
            const user = localStorage.getItem('wc_user') || document.getElementById('username').value.trim();
            const pass = localStorage.getItem('wc_pass') || document.getElementById('password').value.trim();
            if(!user || !pass) return;
            
            document.getElementById('loader').style.display = 'flex';
            try {
                const res = await fetch(`${BASE_URL}/check-user`, { 
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({user, password: pass}) 
                }).then(r => r.json());
                
                if(res.success) {
                    localStorage.setItem('wc_user', user); localStorage.setItem('wc_pass', pass);
                    GLOBAL_DATA = res;
                    document.getElementById('my-rank').innerText = `#${res.userRank}`;
                    document.getElementById('my-score').innerText = res.userScore;
                    document.getElementById('my-status').style.display = 'block';
                    document.getElementById('start-section').style.display = 'none'; 
                    document.getElementById('game-section').style.display = 'block';
                    renderTabs(); loadLB();
                } else { 
                    localStorage.clear(); 
                    if(document.getElementById('username').value) showToast(res.message); 
                }
            } catch(e) { showToast("Connection error"); }
            document.getElementById('loader').style.display = 'none';
        }

        function renderTabs() {
            const container = document.getElementById('day-tabs'); container.innerHTML = "";
            const now = new Date().toISOString().split('T')[0];
            Object.keys(GLOBAL_DATA.allDays).sort().forEach(dayId => {
                const dayInfo = GLOBAL_DATA.allDays[dayId];
                const btn = document.createElement('div');
                btn.className = 'day-tab' + (SELECTED_DAY === dayId ? ' active' : '');
                btn.innerText = (dayInfo.date === now) ? "TODAY" : dayInfo.title;
                btn.onclick = () => selectDay(dayId);
                container.appendChild(btn);
            });
            if(!SELECTED_DAY) selectDay(Object.keys(GLOBAL_DATA.allDays).sort()[0]);
        }

        function selectDay(dayId) {
            SELECTED_DAY = dayId; renderTabs();
            const container = document.getElementById('games-container'); container.innerHTML = "";
            const dayInfo = GLOBAL_DATA.allDays[dayId];
            const now = new Date().toISOString().split('T')[0];

            if (dayInfo.date > now) {
                container.innerHTML = `<div style="padding: 30px; text-align: center; background: rgba(0,0,0,0.2); border-radius: 15px;"><h3 style="color: var(--primary); font-size:16px;">COMING SOON</h3><p style="color: #8899a6; margin-top: 5px; font-size:12px;">Starts on ${dayInfo.date}</p></div>`;
                document.getElementById('save-btn').style.display = 'none'; return;
            }

            const userPred = GLOBAL_DATA.userPredictions.find(p => p.dayId === dayId);
            TEMP_ANSWERS = {};
            
            dayInfo.matches.forEach((game, i) => {
                const teams = game.split(' vs '); let opts = "";
                ['1', 'X', '2'].forEach(opt => {
                    let cls = "opt-btn";
                    if (userPred) {
                        const my = userPred.answers[i]; const real = dayInfo.results ? dayInfo.results[i] : null;
                        if (real && real !== "") {
                            if (opt === real) cls += (my === real) ? " res-correct" : " res-actual";
                            else if (opt === my) cls += " res-wrong";
                        } else if (opt === my) cls += " selected";
                    }
                    opts += `<button class="${cls}" ${userPred ? 'disabled' : `onclick="pick(this, ${i}, '${opt}')"`}>${opt}</button>`;
                });
                container.innerHTML += `<div class="game-card"><div class="match-display"><div class="team-name">${teams[0]}</div><div class="vs-divider">VS</div><div class="team-name">${teams[1]}</div></div><div class="options-grid">${opts}</div></div>`;
            });
            document.getElementById('save-btn').style.display = userPred ? 'none' : 'block';
        }

        function pick(btn, idx, val) { 
            btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected')); 
            btn.classList.add('selected'); 
            TEMP_ANSWERS[idx] = val; 
        }

        async function saveCurrentDay() {
            const user = localStorage.getItem('wc_user');
            const totalMatches = GLOBAL_DATA.allDays[SELECTED_DAY].matches.length;
            if(Object.keys(TEMP_ANSWERS).length < totalMatches) return showToast("Select all matches!");

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.innerText = "SAVING... PLEASE WAIT";

            try {
                const response = await fetch(`${BASE_URL}/save-prediction`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: user, dayId: SELECTED_DAY, answers: TEMP_ANSWERS})
                }).then(r => r.json());

                if(response.success) {
                    showToast("Success! Your prediction is saved.", false);
                    // 🚀 ლოკალური განახლება: აღარ ვიძახებთ startGame-ს ხელახლა
                    GLOBAL_DATA.userPredictions.push({ dayId: SELECTED_DAY, answers: {...TEMP_ANSWERS} });
                    selectDay(SELECTED_DAY);
                } else {
                    showToast(response.message);
                    saveBtn.disabled = false;
                    saveBtn.innerText = "SUBMIT PREDICTIONS";
                }
            } catch(e) {
                showToast("Error saving. Check your connection.");
                saveBtn.disabled = false;
                saveBtn.innerText = "SUBMIT PREDICTIONS";
            }
        }

        async function loadLB() {
            try {
                const data = await fetch(`${BASE_URL}/leaderboard`).then(r => r.json());
                const container = document.getElementById('lb-data'); const currentUser = localStorage.getItem('wc_user');
                container.innerHTML = data.topData.map(u => {
                    const isMe = u.u === currentUser;
                    return `<tr class="lb-row ${isMe ? 'my-row-highlight' : ''}"><td>${u.rank}</td><td class="lb-username">${u.u} ${isMe ? '<span style="color:var(--primary); font-size:10px;">(YOU)</span>' : ''}</td><td style="color:var(--accent-gold); font-weight:700;">${u.p}</td><td style="font-size:12px;">${getPrize(u.rank)}</td></tr>`;
                }).join('');
            } catch(e) {}
        }
        function logout() { localStorage.clear(); location.reload(); }
        window.onload = () => { if(localStorage.getItem('wc_user')) startGame(); else loadLB(); };
    </script>
</body>
</html>
