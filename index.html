<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WC 2026 Predictor</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; padding: 20px; color: #1c1e21; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; }
        .login-box { text-align: center; margin-top: 50px; }
        input { padding: 12px; margin: 8px; width: 85%; max-width: 320px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        button { padding: 12px 25px; background-color: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:hover { background-color: #218838; }
        .day-card { border: 1px solid #e0e0e0; padding: 20px; margin-bottom: 25px; border-radius: 8px; background: #fff; }
        .match-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        select { padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
        .leaderboard { margin-top: 30px; border-collapse: collapse; width: 100%; border-radius: 8px; overflow: hidden; }
        .leaderboard th, .leaderboard td { border: 1px solid #eee; padding: 12px; text-align: left; }
        .leaderboard th { background-color: #f8f9fa; color: #5f6368; font-size: 13px; text-transform: uppercase; }
        .hidden { display: none; }
        .user-bar { display: flex; justify-content: space-between; margin-bottom: 30px; padding: 15px; background: #e7f3ff; border-radius: 8px; color: #1a73e8; font-weight: bold; }
        .status-tag { font-size: 12px; font-weight: normal; color: #28a745; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="login-box">
        <h2>Sign In</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <br>
        <button onclick="login()">Login</button>
        <p id="login-msg" style="color: #d93025; font-size: 14px;" class="hidden"></p>
    </div>

    <div id="main-content" class="hidden">
        <div class="user-bar">
            <div>User: <span id="welcome-user"></span></div>
            <div>Score: <span id="user-score" style="color: #28a745;">0</span></div>
            <div>Rank: <span id="user-rank">#0</span></div>
        </div>

        <div id="days-container">
            </div>

        <div style="margin-top: 40px;">
            <h3>Global Leaderboard</h3>
            <table class="leaderboard">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>User</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const BASE_URL = 'https://rolletto-backend-1.onrender.com/api';
    let currentUser = null;

    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const msg = document.getElementById('login-msg');

        try {
            const res = await fetch(`${BASE_URL}/check-user`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, password: pass })
            });
            const data = await res.json();

            if (data.success) {
                currentUser = user;
                showMain(data);
            } else {
                msg.innerText = "Error: " + data.message;
                msg.classList.remove('hidden');
            }
        } catch (e) {
            alert("Connection to server failed.");
        }
    }

    function showMain(data) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
        document.getElementById('welcome-user').innerText = currentUser;
        document.getElementById('user-score').innerText = data.userScore;
        document.getElementById('user-rank').innerText = "#" + data.userRank;

        loadDays(data.allDays, data.userPredictions);
        loadLeaderboard();
    }

    function loadDays(days, predictions) {
        const container = document.getElementById('days-container');
        container.innerHTML = '<h3>Predict Matches</h3>';

        Object.keys(days).sort((a,b) => a-b).forEach(dayId => {
            const day = days[dayId];
            const hasPredicted = predictions.find(p => p.dayId === dayId);
            
            const card = document.createElement('div');
            card.className = 'day-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom: 15px;">
                    <strong style="color: #1a73e8;">${day.title}</strong>
                    <span style="font-size: 12px; color: #70757a;">${day.date}</span>
                </div>
                ${day.matches.map((m, i) => `
                    <div class="match-row">
                        <span style="font-size: 14px;">${m}</span>
                        <select id="ans-${dayId}-${i}" ${hasPredicted ? 'disabled' : ''}>
                            <option value="">-</option>
                            <option value="1">1</option>
                            <option value="X">X</option>
                            <option value="2">2</option>
                        </select>
                    </div>
                `).join('')}
                ${!hasPredicted 
                    ? `<button onclick="savePredict('${dayId}', ${day.matches.length})" style="width:100%; margin-top:15px;">Submit Prediction</button>`
                    : `<p style="text-align:center; color: #28a745; font-size: 13px; font-weight: bold; margin-top: 15px;">Locked ✓</p>`
                }
            `;
            container.appendChild(card);
        });
    }

    async function savePredict(dayId, count) {
        const answers = {};
        for(let i=0; i<count; i++) {
            const val = document.getElementById(`ans-${dayId}-${i}`).value;
            if(!val) return alert("Please select all match results!");
            answers[i] = val;
        }

        const res = await fetch(`${BASE_URL}/save-prediction`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: currentUser, dayId, answers })
        });
        const data = await res.json();
        if(data.success) {
            alert("Prediction Saved!");
            location.reload();
        }
    }

    async function loadLeaderboard() {
        const res = await fetch(`${BASE_URL}/leaderboard`);
        const data = await res.json();
        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = data.topData.map(u => `
            <tr>
                <td>${u.rank}</td>
                <td>${u.u}</td>
                <td><strong>${u.p}</strong></td>
            </tr>
        `).join('');
    }
</script>

</body>
</html>
