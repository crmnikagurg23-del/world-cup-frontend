<style>
    /* ადმინ პანელის დამატებითი სტილი */
    .admin-panel { background: rgba(255, 204, 0, 0.1); border: 1px solid #ffcc00; padding: 20px; border-radius: 20px; margin-top: 20px; }
    .admin-input { background: rgba(255,255,255,0.05); border: 1px solid #444; padding: 10px; border-radius: 8px; color: white; width: 100%; margin-bottom: 10px; }
</style>

<div id="admin-section" class="main-content hidden">
    <div class="admin-panel">
        <h2 style="color: #ffcc00; font-family: 'Rajdhani'; margin-bottom: 15px;">ADMIN DASHBOARD</h2>
        
        <div style="border-bottom: 1px solid #444; padding-bottom: 15px; margin-bottom: 15px;">
            <p style="font-size: 12px; margin-bottom: 5px;">ADD NEW GAME DAY</p>
            <input id="adm-dayid" class="admin-input" placeholder="Day ID (e.g. 1)">
            <input id="adm-title" class="admin-input" placeholder="Title (e.g. Day 1 - Group Stage)">
            <input id="adm-date" class="admin-input" type="date">
            <input id="adm-sport" class="admin-input" placeholder="Sport (e.g. Football / UFC)">
            <textarea id="adm-matches" class="admin-input" placeholder="Matches (Team A vs Team B | Team C vs Team D)"></textarea>
            <button class="btn-green" onclick="adminAddGame()">CREATE GAME DAY</button>
        </div>

        <div>
            <p style="font-size: 12px; margin-bottom: 5px;">SET RESULTS</p>
            <input id="res-dayid" class="admin-input" placeholder="Day ID">
            <input id="res-values" class="admin-input" placeholder="Results (1 | X | 2 | 1)">
            <button class="btn-green" style="background: #ffcc00;" onclick="adminSetResults()">SAVE RESULTS</button>
        </div>
        <button class="btn-outline" onclick="location.reload()">BACK TO PLAYER VIEW</button>
    </div>
</div>

<script>
    // ... წინა ფუნქციები (startGame, renderTabs და ა.შ.) ...

    // startGame-ში დაამატე ეს ხაზი, როცა პასუხი მოვა:
    if(res.isAdmin) {
        document.getElementById('admin-section').classList.remove('hidden');
    }

    async function adminAddGame() {
        const gameData = {
            dayId: document.getElementById('adm-dayid').value,
            title: document.getElementById('adm-title').value,
            date: document.getElementById('adm-date').value,
            sport: document.getElementById('adm-sport').value,
            matches: document.getElementById('adm-matches').value.split('|').map(m => m.trim()),
            pointsPerGame: 1
        };

        const res = await fetch(`${BASE_URL}/admin/add-game`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ adminUser: localStorage.getItem('wc_user'), gameData })
        }).then(r => r.json());

        if(res.success) { alert("Game Day Added!"); location.reload(); }
    }

    async function adminSetResults() {
        const dayId = document.getElementById('res-dayid').value;
        const results = document.getElementById('res-values').value.split('|').map(r => r.trim());

        const res = await fetch(`${BASE_URL}/admin/set-results`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ adminUser: localStorage.getItem('wc_user'), dayId, results })
        }).then(r => r.json());

        if(res.success) { alert("Results Updated!"); location.reload(); }
    }
</script>
